<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Hello World</title>
    <style>
        /* Define the layout with CSS */
        #container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        #messageContainer {
            flex-grow: 1;
            overflow-y: scroll;
            padding: 10px;
        }

        #output {
            overflow-y: scroll;
            border: 1px solid #ccc;
            padding: 10px;
        }

        #buttonContainer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>
    <h1>WebSocket Hello World</h1>
    <div id="container">
        <div id="messageContainer">
            <div id="output"></div>
        </div>
        <div id="buttonContainer">
            <div>
                Server Address: <span id="serverAddress">ws://localhost:8765</span>
            </div>
            <button id="connectButton" onclick="toggleConnection()">Connect</button>
            <button id="clearButton" onclick="clearMessages()">Clear Messages</button>
        </div>
    </div>
    
    <script>
        const outputDiv = document.getElementById("output");
        const messageContainer = document.getElementById("messageContainer");
        const serverAddress = document.getElementById("serverAddress");
        const connectButton = document.getElementById("connectButton");
        const clearButton = document.getElementById("clearButton");
        let socket;

        function toggleConnection() {
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.close();
                connectButton.textContent = "Connect";
                serverAddress.textContent = "ws://localhost:8765";
            } else {
                const serverAddressValue = serverAddress.textContent;
                socket = new WebSocket(serverAddressValue);

                socket.onopen = () => {
                    connectButton.textContent = "Disconnect";
                    serverAddress.textContent = serverAddressValue;
                };

                socket.onmessage = (event) => {
                    const message = event.data;
                    const messageElement = document.createElement("p");
                    messageElement.textContent = message;
                    outputDiv.appendChild(messageElement);
                    messageContainer.scrollTop = messageContainer.scrollHeight;
                };

                socket.onclose = () => {
                    connectButton.textContent = "Connect";
                    serverAddress.textContent = serverAddressValue;
                };
            }
        }

        function clearMessages() {
            outputDiv.innerHTML = ""; // Clear all messages
        }
    </script>
</body>
</html>
