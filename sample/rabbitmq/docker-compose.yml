version: '3.2'

#docker run -d --hostname rabbitmq-master --name rabbitmq-master -p 5672:5672 -p 15672:15672 -e RABBITMQ_ERLANG_COOKIE='secret cookie here' rabbitmq:3-management

networks:
  vpcbr:
    driver: bridge

services:
  rabbitmq-master:
    image: rabbitmq:3-management
    hostname: rabbitmq-master
    volumes:
      - type: volume
        source: rabbitmq-data
        target: /var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - vpcbr

volumes:
  rabbitmq-data:
